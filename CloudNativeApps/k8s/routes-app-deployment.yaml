apiVersion: apps/v1
kind: Deployment
metadata:
  name: routes-app
  namespace: default
  labels:
    app: routes-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: routes-app
  template:
    metadata:
      labels:
        app: routes-app
    spec:
      terminationGracePeriodSeconds: 0
      containers:
        - name: routes-app
          image: 146691323147.dkr.ecr.us-east-1.amazonaws.com/routes-app:latest
          ports:
            - containerPort: 8000
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          env:
            - name: DATABASE_URL
              value: "postgresql+asyncpg://postgres:dann_grupo12_2026!@dann-db.cxacss8c64jf.us-east-1.rds.amazonaws.com:5432/dann_db"
            - name: DB_HOST
              value: "dann-db.cxacss8c64jf.us-east-1.rds.amazonaws.com"
            - name: DB_PORT
              value: "5432"
            - name: DB_USER
              value: "postgres"
            - name: DB_PASSWORD
              value: "dann_grupo12_2026!"
            - name: DB_NAME
              value: "dann_db"
          readinessProbe:
            httpGet:
              path: /routes/ping
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /routes/ping
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
